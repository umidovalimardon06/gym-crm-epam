spring.datasource.url=jdbc:postgresql://localhost:5432/gymdb
spring.datasource.username=gym
spring.datasource.password=gym
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
management.endpoints.web.exposure.include=health,info,metrics,prometheus,app-info,user-stats,training-stats,system-resources
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:9000
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [txId=%X{transactionId}] %-5level %logger{36} - %msg%n